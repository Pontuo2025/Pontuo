<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pontuo</title>
    <link rel="icon" type="image/svg+xml" href="./assets/img/Vector.svg" />
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body class="home">
    <header>
      <div class="logoHeader">
        <a href="index.html">
          <h1>Pontuo</h1>
          <img src="./assets/img/vecto.png" />
        </a>
      </div>
      <a href="#">
        <button class="loginButton">Login/Register</button>
      </a>
    </header>

    <div class="container">
      <div class="containerLeft">
        <div class="cards">
          <div class="feature-card">
            <h3>Transporte rápido, seguro e fácil de usar</h3>
          </div>
          <div class="feature-card">
            <h3>Descubra como o pontuo facilita a sua jornada</h3>
          </div>
          <div class="feature-card">
            <h3>Segurança<br />Informação fácil<br />Rapidez</h3>
          </div>
        </div>
      </div>

      <div class="containerRight">
        <div class="navList">
          <ul>
            <li>
              <a href="#">
                <img src="./assets/img/icon/map.svg" alt="Localização" />
                <div>Localização</div>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./assets/img/icon/onibus.svg" alt="Rotas" />
                <div>Rotas</div>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./assets/img/icon/SOS.svg" alt="Botão Ajuda" />
                <div>Botão Ajuda</div>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./assets/img/icon/balao de texto.svg" alt="Comunidade" />
                <div>Comunidade</div>
              </a>
            </li>
            <li>
              <a href="#">
                <img src="./assets/img/icon/Estrela.svg" alt="Ranking" />
                <div>Ranking</div>
              </a>
            </li>
          </ul>
        </div>

        <div class="bottom-section">
          <!-- Seção de pontuação do mês -->
          <div class="score-section">
            <h2 class="score-title">Veja sua pontuação do mês</h2>
            <div class="score-buttons">
              <button class="score-btn primary">Iniciar Rota</button>
              <button class="score-btn secondary">Ver Ranking</button>
              <button class="score-btn secondary">Relatar Problema</button>
            </div>
          </div>

          <!-- Call to Action -->
          <div class="cta-section">
            <button class="cta-button">Começar Agora</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
